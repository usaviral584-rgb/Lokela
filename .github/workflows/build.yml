name: Build Lokela AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Lokela project
        run: |
          mkdir -p lokela-project
          unzip -o lokela.zip -d lokela-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Create temporary signing key
        working-directory: lokela-project
        run: |
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore my-upload-key.jks \
            -storepass android \
            -keypass android \
            -dname "CN=Lokela, OU=Mobile, O=Lokela, L=India, ST=India, C=IN"

      - name: Build AAB
        working-directory: lokela-project
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lokela-AAB
          path: lokela-project/app/build/outputs/bundle/release/*.aab
